<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementando o ChartJS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body style="display: flex; flex-direction: row-reverse;">


    <div style="position: relative; height:65vh; width:80vw">
        <canvas id="myChart"></canvas>
    </div>


    <div style="position: relative; height:65vh; width:80vw">
        <canvas id="myChart2"></canvas>
    </div>

</body>

<script>
   
    const labels = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'];


    const data = {
        labels: labels,
        datasets: [{
            label: 'Temperatura Média',
            data: [22, 24, 27, 23, 20, 18],
            fill: false,
            borderColor: 'rgb(75, 192, 192)',
            tension: 0.1,
            backgroundColor: 'darkred',
            borderWidth: 2, borderColor: 'cyan'



            // backgroundColor: 'red'
        },
        {
            label: 'Umidade Média',
            data: [90, 89, 93, 87, 88, 82],
            backgroundColor: 'darkblue',
            tension: 0.1,
            fill: false,
            borderWidth: 2, borderColor: 'cyan'
        }
        ]
    };

    const config = {
        type: 'bar',
        data: data
    };

    const myChart = new Chart(
        document.getElementById('myChart'),
        config
    );


    const labels2 = ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'];
    const data2 = {
        labels: labels2,
        datasets: [{
            label: 'Temperatura',
            data: [30, 29, 28, 25, 22, 23],
            fill: false,
            borderColor: 'darkred',
            backgroundColor: 'darkred',
            tension: 0.1,
        },
        {
            label: 'Umidade',
            data: [80, 82, 80, 85, 80, 83],
            tension: 0.1,
            borderColor: 'darkblue',
            backgroundColor: 'darkblue',
            fill: false,
        }
        ]
    };

    const config2 = {
        type: 'line',
        data: data2,
    };

    const myChart2 = new Chart(
        document.getElementById('myChart2'),
        config2
    );

</script>



</html>
